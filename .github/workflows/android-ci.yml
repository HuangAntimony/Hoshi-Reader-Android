---
name: Android CI

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CMAKE_VERSION: "3.31.6"
      NDK_VERSION: "29.0.14206865"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize required submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive third_party/hoshidicts-kotlin-bridge
          git submodule status --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust/hoshiepub

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and assemble debug APK
        shell: bash
        run: |
          python3 -m pip install -r tools/tests/requirements.txt
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/build-transcription-audio.py --check
          ./gradlew --no-daemon --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            test lint assembleDebug

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-failure-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  preview-apks:
    name: Build preview APKs
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'HuangAntimony/Hoshi-Reader-Android'
    concurrency:
      # An older commit's slow tests must not cancel a newer commit's build.
      group: preview-apk-build-${{ github.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-release-apks.yml
    with:
      ref: ${{ github.sha }}
      preview: true
    secrets: inherit

  publish-preview:
    name: Publish rolling preview
    needs: preview-apks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: preview-apk-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview-apks.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apks
          path: release-assets
      - name: Publish only if this commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.preview-apks.outputs.commit_sha }}
          BUILD_ID: ${{ needs.preview-apks.outputs.build_id }}
          BUILT_AT: ${{ needs.preview-apks.outputs.built_at }}
        run: |
          python3 tools/publish-preview.py \
            --directory release-assets --sha "$COMMIT_SHA" \
            --build-id "$BUILD_ID" \
            --built-at "$BUILT_AT" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
