---
name: Release APK

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing v* tag to release"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      version_name: ${{ steps.release_tag.outputs.version_name }}
      version_code: ${{ steps.release_tag.outputs.version_code }}
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            input_tag="$INPUT_TAG"
          else
            input_tag="${GITHUB_REF_NAME}"
          fi

          version_name="${input_tag#v}"
          if [[ ! "${version_name}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must be semantic, for example v1.2.3. Got: ${input_tag}" >&2
            exit 1
          fi

          tag="v${version_name}"
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_code=$((major * 10000 + minor * 100 + patch))

          {
            echo "tag=${tag}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
          } >> "${GITHUB_OUTPUT}"

  release-apk:
    name: Build signed release APKs
    needs: resolve-release
    uses: ./.github/workflows/build-release-apks.yml
    with:
      ref: ${{ needs.resolve-release.outputs.tag }}
      version_name: ${{ needs.resolve-release.outputs.version_name }}
      version_code: ${{ needs.resolve-release.outputs.version_code }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [resolve-release, release-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-apk.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apks
          path: release-assets

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version_name="${{ needs.resolve-release.outputs.version_name }}"
          changelog="docs/CHANGELOG.md"

          changelog_section="$(awk -v v="${version_name}" '
            $0 ~ "^## \\[(v?" v ")\\]" { found = 1; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' "${changelog}")"

          if [[ -z "${changelog_section//[[:space:]]/}" ]]; then
            changelog_section="$(awk '
              $0 ~ "^## \\[Unreleased\\]" { found = 1; next }
              found && $0 ~ "^## \\[" { exit }
              found { print }
            ' "${changelog}")"
          fi

          if [[ -n "${changelog_section//[[:space:]]/}" ]]; then
            printf '%s\n' "${changelog_section}" > release_notes.md
          else
            {
              echo "Release ${{ needs.resolve-release.outputs.tag }}"
              echo
              echo "No matching section found in docs/CHANGELOG.md for ${version_name}."
            } > release_notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          prerelease_flag=()

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" \
            && "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --notes-file release_notes.md
            if [[ ${#prerelease_flag[@]} -gt 0 ]]; then
              gh release edit "${tag}" "${prerelease_flag[@]}"
            fi
          else
            gh release create "${tag}" \
              --title "Hoshi Reader ${tag}" \
              --notes-file release_notes.md \
              "${prerelease_flag[@]}"
          fi

          gh release upload "${tag}" release-assets/*.apk release-assets/LICENSE --clobber
